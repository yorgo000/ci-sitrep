<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=sitrep.html#executive-dashboard">
<title>Executive dashboard — CI SITREP</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1a1a1a; background: #faf6ef; line-height: 1.6; font-size: 16px; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 26px; color: #283060; margin: 0 0 8px; }
  p { margin: 8px 0; }
  a { color: #283060; }
</style>
<meta name="robots" content="noindex, nofollow">
<style>/* QA banner offset: fixed overlays start below the in-flow QA banner while it is visible (--qa-banner-h, set by the banner script; 0 once scrolled past). QA-only. */
.tools-drawer{top:var(--qa-banner-h,0px);height:calc(100vh - var(--qa-banner-h,0px));height:calc(100dvh - var(--qa-banner-h,0px))}
@media (max-width:900px){nav.sidebar{top:var(--qa-banner-h,0px);height:calc(100vh - var(--qa-banner-h,0px));height:calc(100dvh - var(--qa-banner-h,0px))}}
</style>
</head>
<body>
<div id="qa-banner" style="position:static;background:#b3543f;color:#fff;font:600 15px/1.4 system-ui,sans-serif;padding:8px 16px;text-align:center">QA &mdash; review copy, not the live report &middot; levels variant &middot; <a href="../index.html" style="color:#fff;text-decoration:underline">live report &rarr;</a></div>
<script>(function(){var b=document.getElementById("qa-banner");if(!b)return;var q=false;function s(){q=false;document.documentElement.style.setProperty("--qa-banner-h",Math.max(0,b.getBoundingClientRect().bottom)+"px");}function r(){if(!q){q=true;requestAnimationFrame(s);}}s();window.addEventListener("scroll",r,{passive:true});window.addEventListener("resize",r);window.addEventListener("load",r);})();</script>

<main>
<h1>Executive dashboard</h1>
<p>The Executive dashboard has moved — it is now the first section of the SITREP page.</p>
<p><a href="sitrep.html#executive-dashboard">Continue to the Executive dashboard</a></p>
</main>
<script>window.location.replace("sitrep.html#executive-dashboard");</script>
</body>
</html>
